name: Verify Riverline
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -c backend/requirements.lock -e './backend[dev]'
      - run: ruff check backend && ruff format --check backend
      - run: pytest backend/tests -q
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend && npm run build --prefix frontend && npm run format:check --prefix frontend
      - run: docker compose up -d --build --wait
      - run: RIVERLINE_INTEGRATION_URL=http://127.0.0.1:8000 pytest backend/tests/test_integration.py -q
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
